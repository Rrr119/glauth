#################
# glauth sample configuration for the "file" (JSON directory) backend.
#
# The file backend keeps users and groups in a JSON document that can be
# rewritten out of band by provisioning tooling. It supports the same identity
# model as the config backend, including group inheritance through
# includegroups, and can hot-reload the document when watchfile = true.

debug = false
watchconfig = true

[ldap]
  enabled = true
  listen = "0.0.0.0:3893"
  tls = false

[ldaps]
  enabled = false

[[backends]]
  datastore = "file"
  baseDN = "dc=glauth,dc=com"
  # Path to the JSON directory file (see sample-file-directory.json).
  file = "sample-file-directory.json"
  # Reload the JSON file automatically whenever it changes.
  watchfile = true
  nameformat = "cn"
  groupformat = "ou"
  anonymousdse = false
